---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-moon
  namespace: feira-de-jogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyber-moon
  template:
    metadata:
      labels:
        app: cyber-moon
    spec:
      containers:
        - name: cyber-moon
          image: ghcr.io/feira-de-jogos/cyber-moon:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: cyber-moon
  namespace: feira-de-jogos
spec:
  selector:
    app: cyber-moon
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cyber-moon
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: gateway-feira-de-jogos
      sectionName: https-cyber-moon
  hostnames:
    - "cyber-moon.feira-de-jogos.dev.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: cyber-moon
      port: 80
