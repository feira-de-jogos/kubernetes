---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ouroboros
  namespace: feira-de-jogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ouroboros
  template:
    metadata:
      labels:
        app: ouroboros
    spec:
      containers:
        - name: ouroboros
          image: ghcr.io/feira-de-jogos/ouroboros:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ouroboros
  namespace: feira-de-jogos
spec:
  selector:
    app: ouroboros
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ouroboros
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: gateway-feira-de-jogos
      sectionName: https-ouroboros
  hostnames:
    - "ouroboros.feira-de-jogos.dev.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: ouroboros
      port: 8080
