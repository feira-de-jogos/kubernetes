---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tron
  namespace: feira-de-jogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tron
  template:
    metadata:
      labels:
        app: tron
    spec:
      containers:
        - name: tron
          image: ghcr.io/feira-de-jogos/tron:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: tron
  namespace: feira-de-jogos
spec:
  selector:
    app: tron
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tron
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: gateway-feira-de-jogos
      sectionName: https-tron
  hostnames:
    - "tron.feira-de-jogos.dev.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: tron
      port: 80
