---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snct
  namespace: feira-de-jogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snct
  template:
    metadata:
      labels:
        app: snct
    spec:
      containers:
        - name: snct
          image: ghcr.io/feira-de-jogos/snct:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: snct
  namespace: feira-de-jogos
spec:
  selector:
    app: snct
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: snct
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: gateway-feira-de-jogos
      sectionName: https-snct
  hostnames:
    - "snct.feira-de-jogos.dev.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: snct
      port: 80
