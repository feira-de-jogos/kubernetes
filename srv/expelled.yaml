---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expelled
  namespace: feira-de-jogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expelled
  template:
    metadata:
      labels:
        app: expelled
    spec:
      containers:
        - name: expelled
          image: ghcr.io/feira-de-jogos/expelled:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: expelled
  namespace: feira-de-jogos
spec:
  selector:
    app: expelled
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: expelled
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: gateway-feira-de-jogos
      sectionName: https-expelled
  hostnames:
    - "expelled.feira-de-jogos.dev.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: expelled
      port: 3000
