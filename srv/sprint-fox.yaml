---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprint-fox
  namespace: feira-de-jogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sprint-fox
  template:
    metadata:
      labels:
        app: sprint-fox
    spec:
      containers:
        - name: sprint-fox
          image: ghcr.io/feira-de-jogos/sprint-fox:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sprint-fox
  namespace: feira-de-jogos
spec:
  selector:
    app: sprint-fox
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sprint-fox
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: gateway-feira-de-jogos
      sectionName: https-sprint-fox
  hostnames:
    - "sprint-fox.feira-de-jogos.dev.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: sprint-fox
      port: 3000
