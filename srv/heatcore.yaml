---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heatcore
  namespace: feira-de-jogos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heatcore
  template:
    metadata:
      labels:
        app: heatcore
    spec:
      containers:
        - name: heatcore
          image: ghcr.io/feira-de-jogos/heatcore:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: heatcore
  namespace: feira-de-jogos
spec:
  selector:
    app: heatcore
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: heatcore
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: gateway-feira-de-jogos
      sectionName: https-heatcore
  hostnames:
    - "heatcore.feira-de-jogos.dev.br"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: heatcore
      port: 3000
